name: Daily NFL Data Update

on:
  schedule:
    # 매일 UTC 06:00 (한국 시간 15:00)에 자동 실행
    - cron: '0 6 * * *'
  # 수동 실행 버튼 활성화
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 데이터 업데이트 스크립트 실행
        run: |
          python scripts/update_data.py

      - name: 갱신된 nfl_data.json 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NFL data [$(date +'%Y-%m-%d')]" && git pull --rebase && git push)
